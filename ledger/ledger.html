    <script id="ledger-data" type="application/json">{"project":"dashboards","staleAfterDays":14,"records":[{"id":"DSH-001","title":"No project publishes a status file yet","type":"improvement","severity":"high","status":"closed","foundBy":"session agent, while building this repository","opened":"2026-09-10","resolved":"2026-09-23","stint":null,"evidence":{"commits":["4c204c6","bdffc5c"],"integrated":[],"verified":"Each of the nine projects in projects.json serves ci-status.json in schema 2, and scripts/check-status.py accepts all nine. Every sibling's pages workflow runs this repository's action."},"resolution":"Every listed project publishes its status file from its own pages workflow, with the action this repository carries.","details":"The CI page assembles codesweep.ai/\u003cproject>/ci-status.json from every project listed in projects.json. None of them publishes one, so the page renders seven unreachable cards. Six of the seven serve Pages straight from their main branch. Publishing a file there would mean committing it on every build. They move to workflow-built Pages first, so the status ships in the deployment instead. The worked example is examples/lint-pages.yml. The ui project is already workflow-built and needs the other variant, which dispatches its pages workflow. That is because a push made with GITHUB_TOKEN starts no workflow.","notes":[{"date":"2026-09-10","text":"Every project listed in projects.json now publishes a status file. Fetched https://codesweep.ai/\u003cproject>/ci-status.json for campaign, ledger, lint, sandbox, tracer, ui and vcr on 2026-09-10. All seven returned HTTP 200, each schema 1 and generated that day. scripts/check-status.py accepted every one against SPEC.md. The record stays open because a closure has to cite a commit in this repository, and the work landed in the seven project repositories instead."}],"links":[]},{"id":"DSH-002","title":"The dependencies page is not built","type":"feature-idea","severity":"med","status":"closed","foundBy":"session agent, while building this repository","opened":"2026-09-10","resolved":"2026-09-12","stint":"deps-page","evidence":{"commits":["7f94c94","5a088f7"],"integrated":[],"verified":"make ci passed when the page was first built: 43 collector unit tests OK, and prose, refs, oss and ledger clean. A full collector run wrote 409 records, with 0 failures in 287 registry requests. The shape check in scripts/check-deps.py accepted the file. The page rendered all five views from it in headless Chromium with no console errors."},"resolution":"The page is built, at /dashboards/deps, and the README links it. This site's Pages build writes the file it reads, on every push and daily, as the details anticipated. The collector clones each project over plain git and asks public registries, so no project changes and no API key is involved. It covers Go, npm, GitHub Actions, toolchains, images, Fedora packages, native pins and internal pins. SPEC.md describes the file and the rules that grade each dependency.","details":"How far behind each project's dependencies are. No repository in the org carries a dependabot.yml, so this page would be the only signal. The history shows the bumps are done by hand. Unlike the CI page, this one reports a state rather than an event. Nothing publishes it on a build, so it needs a schedule of its own. index.html already lists it as a placeholder.","notes":[{"date":"2026-09-10","text":"index.html is deleted and the README is now the site's landing page, as in the sibling projects. There is no placeholder list any more, so this page announces itself by being linked from the README once it is built."},{"date":"2026-09-12","text":"The first collection found work the page now queues. The sandbox guest kernel line 6.19 is past its end of life. Fedora security updates for curl and tar shipped after sandbox's base image was built. golang.org/x/mod v0.39.0 in lint, ledger and tracer carries two advisories fixed in 0.40.0."}],"links":[]},{"id":"DSH-003","title":"The open-source readiness page is not built","type":"feature-idea","severity":"med","status":"open","foundBy":"session agent, while building this repository","opened":"2026-09-10","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"What cs-lint reports about each repository's documents and metadata, across the org. The data is what `cs-lint oss` already produces per repository. The work is publishing it the way the CI status is published, rather than computing anything new. index.html already lists it as a placeholder.","notes":[{"date":"2026-09-10","text":"index.html is deleted and the README is now the site's landing page, as in the sibling projects. There is no placeholder list any more, so this page announces itself by being linked from the README once it is built."}],"links":[]},{"id":"DSH-004","title":"The releases page is not built","type":"feature-idea","severity":"low","status":"open","foundBy":"session agent, while building this repository","opened":"2026-09-10","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"Latest release per project, commits on main since it, and the published package version against the repository's. It would earn its place immediately. Six of the seven projects have no release at all, and release.yml has never run in any of them. index.html already lists it as a placeholder.","notes":[{"date":"2026-09-10","text":"index.html is deleted and the README is now the site's landing page, as in the sibling projects. There is no placeholder list any more, so this page announces itself by being linked from the README once it is built."}],"links":[]},{"id":"DSH-005","title":"The dependencies page lists everything but does not say what to do next","type":"improvement","severity":"med","status":"closed","foundBy":"user report (session): \"The dashboard is very rich but a bit overwhelming, not giving me a good view of what actions to take.\"","opened":"2026-09-12","resolved":"2026-09-13","stint":"deps-page","evidence":{"commits":["7f94c94","5a088f7"],"integrated":[],"verified":"make ci passed at 5a088f7: 87 collector unit tests OK, the collector's run over this repository matched SPEC.md, and prose, refs, oss and ledger were clean. A full collector run wrote 3,484 records and 79 actions, with 0 failures in 530 requests. The shape check in scripts/check-deps.py accepted both JSON files. Validating the SBOM against the CycloneDX 1.6 schema reported 0 errors. Rendered from the collector's actions, the page matched the earlier page's actions on the same data, apart from intended wording. Every view rendered in both themes and at phone width in headless Chromium, with no console errors and no sideways scroll."},"resolution":"The projects view is the default. It leads with the next action, and each card links to the project's page, whose rows open onto their detail. Upgrades sorts every action into three tiers of urgency: fix now, plan and routine. The internal view is a card per project, like the projects view. The lifecycle view reads macOS, WSL and self-hosted runners. The inventory lists indirect dependencies, Fedora package versions and what a floating pin resolves to. The collector now decides the actions, so the page and the agent file deps-actions.json follow the same work.","details":"This is a review of the first version of the dependencies page. The upgrades view is one long list with no structure. The projects view is the useful one, but nothing on a card links to the detail behind it, and it is not the default. The internal view is a matrix and a table, unlike the projects view. The lifecycle view is missing the macOS runners in particular. It shows no `macos-latest`, no `macos-15-intel` from a matrix, and none of the self-hosted macOS ARM64 runners in campaign and sandbox. The inventory leaves out indirect dependencies, Fedora package versions, and what a floating pin resolves to.","notes":[{"date":"2026-09-12","text":"The page now leads with one next action and three tiers of urgency, and one word ladder runs through every chip. Cards carry evidence beside each verdict: Go reachability, license verdicts including Fedora packages, supply chain signals and gap age. The lifecycle view reads the macOS, WSL and self-hosted runners, and the inventory includes indirect records. Commits still to come, on the deps-page stint."}],"links":[]},{"id":"DSH-006","title":"The CI page dates a project by when its status file was written, which a scheduled rebuild keeps fresh","type":"defect","severity":"med","status":"closed","foundBy":"user report (session): \"Since we have the run dates in the projects cards, can't we detect 72-hour staleness that way in the dashboard?\"","opened":"2026-09-15","resolved":"2026-09-15","stint":"2026-09-15 CI status reported as running","evidence":{"commits":["dc53072"],"integrated":[],"verified":"The page was rendered in headless Chromium over the published status files, with lint's latest ci run back-dated a week and its file an hour old. The card for lint was flagged as `last ci run 7d ago · status published 1h ago`, and the notice named it. A copy of vcr with no ci workflow fell back to its file's date and was flagged too.\n\nOnce dc53072 was deployed, the live page flagged tracer as `last ci run 5d ago` and no other project. `make ci` passed at a33e346."},"resolution":"`ci.js` dates a project by its latest ci run, and falls back to `generated` only when there is no ci run. A project that rebuilds its site on a schedule is still flagged once it stops building.","details":"`ci.js` flags a card as stale when the file's `generated` time is more than 72 hours old. That measured how long ago the project built only while a status was written after ci alone.\n\nledger, lint, sandbox and ui now also rebuild their Pages site after prune-images, which runs every day. Their files are therefore never more than a day old, so the flag can no longer fire for them, even when nothing has been pushed for weeks.\n\nThe file already carries the date that matters. The latest run of the `ci` workflow moves only when the project builds, and it stops moving when the file stops being published.","notes":[],"links":[]},{"id":"DSH-007","title":"A fork of this repository shows codesweep-ai's name, and previews codesweep-ai's runs","type":"defect","severity":"med","status":"closed","foundBy":"user report (session): \"On the dashboard, make sure that it can work in a fork as well, and give an accurate dashboard view of the status of the fork, without hardcoding references to the codesweep-ai org.\"","opened":"2026-09-15","resolved":"2026-09-15","stint":"2026-09-15 CI status reported as running","evidence":{"commits":["de1cf46","8a83235","a33e346"],"integrated":[],"verified":"`make ci` passed at a33e346, with 95 unit tests where there were 89. Reverting each of five fixes in a scratch copy failed the new test written for it.\n\nThe collector ran over one account's forks of ledger, lint and ui, with `--owner` naming that account. It read each fork at its own head. It found the same internal dependencies as a run over codesweep-ai: 3, 2 and 11. Its compare links and its decline target named that account. The dependencies page rendered that file in headless Chromium, with every repository link on that account and the codesweep-ai title.\n\nThe live build at a33e346 read its previous file from https://codesweep.ai/dashboards/deps.json and carries three days of history. The Makefile derives OWNER=alice when GITHUB_REPOSITORY is alice/dashboards. No fork has Pages enabled, so a deployed fork was not tried."},"resolution":"The collector takes `--owner` and `--site` apart from `org`, so a fork's build reads its own owner's repositories and its own history. The codesweep-ai modules, packages and images still count as siblings. `make status` and `make test` read the checkout's own owner. Every page keeps the codesweep-ai name.","details":"The CI page itself already reads a fork's own data. Every path in `projects.json` is relative, so a fork served at `\u003cowner>.github.io/dashboards/` fetches `\u003cowner>.github.io/\u003cproject>/ci-status.json`, which that owner's fork of the project publishes.\n\nThree things still name codesweep-ai. `projects.json` sets the title to `codesweep-ai CI`, and `ci.html` carries the same name, so a fork's tab says it is codesweep-ai's. `make status` and `make test` read `codesweep-ai/\u003cproject>` from the API, so a fork's preview shows the upstream runs rather than its own. SPEC.md places every status file under `codesweep.ai`, which is true of one deployment only.","notes":[{"date":"2026-09-15","text":"The codesweep-ai name is not part of the defect. The repository owner wants every page to keep it in a fork, so the title in `projects.json` and `ci.html` stays. Only where a page reads its data from has to follow the fork."},{"date":"2026-09-15","text":"The dependencies page had the deeper form of this. The collector's `org` both named whose repositories to clone and which modules and packages count as siblings. A fork keeps codesweep-ai's module paths and npm scope, so it could not change `org` without losing its siblings. Its build also read upstream's previous `deps.json`, so a fork's history never accumulated."}],"links":[]},{"id":"DSH-008","title":"A Go toolchain action moves go.mod and leaves every other file its change names","type":"defect","severity":"med","status":"closed","foundBy":"deps-maintenance campaign, pilots 1 and 2: the pilot2 orchestrator's findings (campaign-workspaces/deps-maintenance/pilot2/archives/deps-pilot2-20260922T203209Z/orchestrator/output/findings.md) and the step corrections pilot3's coordination.md section 5 carries","opened":"2026-09-22","resolved":"2026-09-22","stint":"pilot2-tier1","evidence":{"commits":["5a7d393"],"integrated":[],"verified":"`make ci` passed at 10cc896, with 111 unit tests where main had 95, and with the end-to-end run of the action. The fixture test `test_a_toolchain_move_edits_every_module_file_and_the_containerfile` fails on the old step builder.\n\nThe collector's run of 2026-09-22T22:07:49Z over all nine projects emits a `go mod edit` step for each module file in all eight toolchain actions. The sandbox action also gets an edit at `image/Containerfile.base:273` naming `GO_VERSION` and its checksums.\n\nEach ran verbatim in a clean clone at the head the report names. The ledger action's two steps changed only `go.mod` and `go.golangci.mod`, and `make check` exited 0. In sandbox, the two steps and the edits made by hand changed only `go.mod`, `go.golangci.mod` and `image/Containerfile.base`. Its `make check` exited 0 in a full clone, since two of its tests cannot zip a git worktree. The edits by hand were the ARG, both checksums and the action's Node.js line. The image was not built."},"resolution":"Each module file a Go floor sits in gets its own `go mod edit`, with `-modfile` for a file other than go.mod. Any other place the version is written gets an edit. A Containerfile ARG folded into the record keeps its name on its source, so the edit names it.","details":"A `routine:runtime` action for the Go toolchain emits one step, `go mod edit -go=\u003cversion>`, while the change's own `files` name `go.golangci.mod` as well. Run as printed, it raises `go.mod` and leaves `go.golangci.mod` on the old floor, so the linter builds against it. The steps are built from the record's first source only.\n\nIn sandbox the same record also points at `ARG GO_VERSION` in `image/Containerfile.base`, and the action emits `go mod edit -go=1.27.1` with `cwd: image`, where no `go.mod` exists. It fails there, and the ARG and the checksums beside it never move.\n\nSeen in the report of 2026-09-22T05:24:19Z: `campaign`, `ledger`, `lint`, `npmrevs`, `tracer`, `vcr` and `sandbox:routine:runtime`.","notes":[],"links":[]},{"id":"DSH-009","title":"The golangci-lint step adds a bogus tool line, and the build then fails","type":"defect","severity":"high","status":"closed","foundBy":"deps-maintenance campaign, pilots 1 and 2: the pilot2 orchestrator's findings (campaign-workspaces/deps-maintenance/pilot2/archives/deps-pilot2-20260922T203209Z/orchestrator/output/findings.md) and the step corrections pilot3's coordination.md section 5 carries","opened":"2026-09-22","resolved":"2026-09-22","stint":"pilot2-tier1","evidence":{"commits":["94dcebb"],"integrated":[],"verified":"`make ci` passed at 10cc896, with 111 unit tests where main had 95, and with the end-to-end run of the action. `test_a_tool_moves_by_its_command_and_its_module_file_is_never_tidied` and the extractor test for tool packages fail on the old code.\n\nThe collector's run of 2026-09-22T22:07:49Z over all nine projects has no step passing `-tool` a module path and none tidying a module file other than go.mod.\n\nThe ledger action for Go modules ran verbatim in a clean clone, and its 3 steps exited 0. `git status` showed `go.mod`, `go.sum`, `go.golangci.mod` and `go.golangci.sum`. The linter built and reported 0 issues, deadcode built, and `make check` exited 0. In the same clone the module-path form added a second tool line and printed `cannot find module providing package`. The plain module form without `-tool` left out `github.com/golangci/canonicalheader`, a requirement v2.13.2's command gained."},"resolution":"The extractor names each tool on the source of the module that provides it, and `go get` moves a tool by that command. A module file other than go.mod is never tidied.","details":"A `routine:go` action emits `go get -modfile=go.golangci.mod -tool github.com/golangci/golangci-lint/v2@v2.13.2`. The `-tool` flag names the module root rather than its command. Run as printed in a clone of ledger's main of 2026-09-22, it adds `github.com/golangci/golangci-lint/v2` to the tool block beside the real `.../v2/cmd/golangci-lint`, and prints `cannot find module providing package`. The pilots saw the linter's build then fail on a missing `go.sum` entry.\n\n`golang.org/x/tools` has the same fault the other way round. It is an indirect requirement in `go.golangci.mod` and the module of the `deadcode` tool in `go.mod`, and the action emits `go get -modfile=go.golangci.mod -tool golang.org/x/tools@v0.50.0`: a second bogus tool line, and `go.mod` never moves. `go mod tidy -modfile=go.golangci.mod`, the obvious repair, is wrong as well. Run on ledger's main of 2026-09-22, it adds 59 lines to `go.golangci.sum` and a requirement on ledger itself. Tidy reads the packages in the directory rather than the tool the file exists for.","notes":[],"links":[]},{"id":"DSH-010","title":"A sibling Go sync tells an agent to run make repin, which moves every pin to main","type":"defect","severity":"med","status":"closed","foundBy":"deps-maintenance campaign, pilots 1 and 2: the pilot2 orchestrator's findings (campaign-workspaces/deps-maintenance/pilot2/archives/deps-pilot2-20260922T203209Z/orchestrator/output/findings.md) and the step corrections pilot3's coordination.md section 5 carries","opened":"2026-09-22","resolved":"2026-09-22","stint":"pilot2-tier1","evidence":{"commits":["4c85340"],"integrated":[],"verified":"`make ci` passed at 10cc896, with 111 unit tests where main had 95, and with the end-to-end run of the action. `test_a_sibling_pin_moves_to_its_head_commit_and_nothing_else` fails on the old code.\n\nThe collector's run of 2026-09-22T22:07:49Z over all nine projects emits no `make repin`. Each of its 23 Go syncs runs `go get -tool \u003ccommand>@\u003clag.head> && go mod tidy`.\n\nThe dashboards action syncing ledger ran verbatim in a clean clone and exited 0. Then `go tool cs-ledger version` printed the pseudo-version of the commit the report names. `git status` showed `go.mod` and `go.sum`, and `make check` passed."},"resolution":"A Go sync moves one pin to the commit in `lag.head`, in each module file that pins it, and nothing else.","details":"Every Go `sync` action emits `make repin` as its one step. That target moves every sibling pin at once, so it cannot make one action as one commit. It resolves `@latest`, so it cannot reach the commit the action names in `lag.head`. In a campaign it pins a sibling's base instead of its frozen commit, and pilot2's qa measured it pinning lint's base. The step that makes one action is `go get \u003cmodule>@\u003clag.head>` followed by `go mod tidy`.","notes":[{"date":"2026-09-22","text":"Moving a sibling to its newest commit also raises any pin that commit requires. In dashboards the ledger sync moved the lint pin too, because ledger now requires a newer lint. That is minimal version selection, and the campaign's pin rules already say to select the other action first."}],"links":[]},{"id":"DSH-011","title":"An npm sync installs a dist-tag, which can move the pin backwards","type":"defect","severity":"high","status":"closed","foundBy":"deps-maintenance campaign, pilots 1 and 2: the pilot2 orchestrator's findings (campaign-workspaces/deps-maintenance/pilot2/archives/deps-pilot2-20260922T203209Z/orchestrator/output/findings.md) and the step corrections pilot3's coordination.md section 5 carries","opened":"2026-09-22","resolved":"2026-09-22","stint":"pilot2-tier1","evidence":{"commits":["441e86c"],"integrated":[],"verified":"`make ci` passed at 10cc896, with 111 unit tests where main had 95, and with the end-to-end run of the action. `test_an_internal_npm_pin_names_the_build_of_the_head_commit` and `test_a_sibling_pin_installs_the_build_of_its_head_commit_not_a_tag` fail on the old code.\n\nThe collector's run of 2026-09-22T22:07:49Z over all nine projects names no dist-tag. Each of its 5 npm syncs installs the exact version the registry built from the head commit.\n\nThe ui action syncing ledger ran verbatim in a clean clone. It moved `package.json` and `package-lock.json` to the build of ledger's head, which `npx cs-ledger version` printed, and `npm run check` exited 0."},"resolution":"The resolver reads the registry's versions for an internal npm pin and records the one built from the head commit as `lag.version`. An npm sync installs that version exactly, and says it is waiting when the registry holds none.","details":"An npm `sync` action emits `npm install --save-exact \u003cpackage>@dev` for `@codesweep-ai/ui` and `@latest` for every other sibling. A tag moves, and the action means one version: the build of the commit in `lag.head`. On 2026-09-22 `@codesweep-ai/ledger@latest` was the build of 2026-09-15, older than the build of 2026-09-20 that ui pins, so `ui:sync:ledger-npm-codesweep-ai-ledger` run as printed moves the pin backwards. Through cs-npmrevs a tag other than `latest` answers npmjs.com's version rather than a campaign's.","notes":[],"links":[]},{"id":"DSH-012","title":"ledger's ui sync runs npm where there is no package.json, and misses three steps","type":"defect","severity":"med","status":"closed","foundBy":"deps-maintenance campaign, pilots 1 and 2: the pilot2 orchestrator's findings (campaign-workspaces/deps-maintenance/pilot2/archives/deps-pilot2-20260922T203209Z/orchestrator/output/findings.md) and the step corrections pilot3's coordination.md section 5 carries","opened":"2026-09-22","resolved":"2026-09-22","stint":"pilot2-tier1","evidence":{"commits":["f3f9448","10cc896"],"integrated":[],"verified":"`make ci` passed at 10cc896, with 111 unit tests where main had 95, and with the end-to-end run of the action. `test_the_ui_pin_edits_the_go_constant_and_rebuilds_and_re_renders_after` fails on the old step builder.\n\nThe ledger ui sync from the collector's run of 2026-09-22T22:07:49Z ran verbatim in a clean clone, with its three edits made by hand. Every command exited 0, and none ran in `internal/ledger`. Both pages re-rendered at renderer 0.7.1, `make check` exited 0, and `make viewer-check` passed once the result was committed. `git status` held the viewer's manifest, lockfile and bundle, `render.go`, `MANUAL.md`, and both ledgers' pages and configs.\n\nIn campaign, the ui sync as printed left `make viewer-check` red on a stale `viewer.html`. With the `make viewer-build` step deps-config.json now adds, it passed."},"resolution":"An npm step runs only where a package.json or its lockfile is. Any other place a pin is written, such as the constant a configured pin reads, gets an edit. The new `after` in deps-config.json lists the steps a move needs beyond its manifest, with entries for ledger and campaign.","details":"`ledger:sync:ui-npm-codesweep-ai-ui` emits `npm install --save-exact @codesweep-ai/ui@dev` in `viewer` and again in `internal/ledger`. The second directory holds no `package.json`, only the `UIVersion` string in `render.go` that a pin in `deps-config.json` reads, so the command would create one. The version string needs an edit, not a command.\n\nThe action also cannot be done without three steps no manifest states. `viewer/index.html`, the bundle `assets.go` embeds, has to be rebuilt. Both committed pages, `ledger/ledger.html` and `fixtures/sandbox/ledger/ledger.html`, have to be re-rendered. `RendererVersion` has to move, as ledger's CONTRIBUTING.md requires when the rendered output changes. pilot1 found all three the hard way.","notes":[{"date":"2026-09-22","text":"tracer pins @codesweep-ai/ui too and commits the viewer it builds. Its pin was current in this run, so no action exercised it and no `after` entry was added for it."}],"links":[]},{"id":"DSH-013","title":"A fix action's done_when names a version, and the registry moves under the plan","type":"defect","severity":"med","status":"closed","foundBy":"deps-maintenance campaign, pilots 1 and 2: the pilot2 orchestrator's findings (campaign-workspaces/deps-maintenance/pilot2/archives/deps-pilot2-20260922T203209Z/orchestrator/output/findings.md) and the step corrections pilot3's coordination.md section 5 carries","opened":"2026-09-22","resolved":"2026-09-22","stint":"pilot2-tier1","evidence":{"commits":["0ff4591"],"integrated":[],"verified":"`make ci` passed at 10cc896, with 111 unit tests where main had 95, and with the end-to-end run of the action. The two done_when tests fail on the old wording.\n\nThe collector's run of 2026-09-22T22:07:49Z over all nine projects has 19 vulnerable changes, and no done_when among them names a version.\n\nThe tracer refresh of `fixtures/test` ran verbatim in a clean clone, exited 0, and landed fast-uri at 3.1.8 where `to` says 3.1.6. `npm audit --package-lock-only` then flagged nothing, which is what the done_when asks."},"resolution":"A vulnerable change's done_when names the lockfile, module files or pin and the advisories, and never a version. SPEC.md and the file's workflow say a step's exit status is not its check.","details":"A vulnerable change's `done_when` reads `no advisory affects the pinned version: 3.1.6 or newer`. The number is stale by the time anyone runs the step. In pilot2, 8 of 10 rows of one `npm audit fix` landed above the version the report named, and fast-uri landed at 3.1.8 rather than 3.1.6, both correctly. A version is also the wrong test: a newer release can carry an advisory of its own. The condition that matters is that the lockfile no longer carries a copy the advisory affects. `npm audit fix` exits 0 whether or not it changed anything, so its exit code proves nothing either, and the file does not say so.","notes":[],"links":[]},{"id":"DSH-014","title":"An action met in full by another action in the same build is still listed as open","type":"defect","severity":"low","status":"closed","foundBy":"deps-maintenance campaign, pilots 1 and 2: the pilot2 orchestrator's findings (campaign-workspaces/deps-maintenance/pilot2/archives/deps-pilot2-20260922T203209Z/orchestrator/output/findings.md) and the step corrections pilot3's coordination.md section 5 carries","opened":"2026-09-22","resolved":"2026-09-22","stint":"pilot2-tier1","evidence":{"commits":["a8f887f"],"integrated":[],"verified":"`make ci` passed at 10cc896, with 111 unit tests where main had 95, and with the end-to-end run of the action. The three fold tests fail without the fold, and fail without the lockfile's `via`.\n\nThe collector's run of 2026-09-22T22:07:49Z over all nine projects has no refresh for tracer's `apps/viewer`. Its three packages sit on the vitest action with `cleared_by: [\"vitest\"]`. The `fixtures/test` refresh stays, since its fast-uri comes through a dependency nothing moves.\n\nThe vitest action's one step, run verbatim in a clean clone of tracer, left @vitest/mocker 4.1.11, vite 6.4.3 and esbuild 0.25.12 in the lockfile. An `npm audit --package-lock-only` run then reported no vulnerable package. All 102 viewer tests passed, and the build left its committed artifacts byte-identical. A headless Chrome screenshot shows the card in both themes."},"resolution":"The extractor records which declared dependencies install each lockfile package. The resolver asks deps.dev what each planned move installs, and a copy no range could keep joins the action that makes the move. A refresh left with nothing is not listed.","details":"`tracer:lock:tracer-apps-viewer-package-lock-json` refreshes three vulnerable copies in `apps/viewer`: `@vitest/mocker` 2.1.9, `vite` 5.4.21 and `esbuild` 0.21.5. All three are installed only through `vitest` 2.1.9, which `tracer:dep:github-com-vitest-dev-vitest` moves to 4.1.11. In pilot2 that upgrade met every change of the lock action, with the vulnerable copies gone rather than shadowed, yet the page still listed the lock action as open. An agent following the file makes an empty commit or reports the action by hand.","notes":[{"date":"2026-09-22","text":"npm dedupes onto a copy already in the tree when the range allows it. In tracer that was the declared vite 6.4.3 rather than the 8.3.0 deps.dev resolved, and both clear the advisory. A declared copy that is itself vulnerable keeps its own action."}],"links":[]},{"id":"DSH-015","title":"The Makefile invents an owner when origin is not a GitHub URL, and the clone then fails as a credential error","type":"defect","severity":"med","status":"closed","foundBy":"deps-maintenance campaign, pilots 1 and 2: F15.8 and F15.9 in the pilot1 orchestrator's findings log (campaign-workspaces/deps-maintenance/pilot/archives/deps-pilot-20260922T141947Z/orchestrator/output/findings-log.md), and the special-cased gate command pilot2 and pilot3 carry","opened":"2026-09-22","resolved":"2026-09-22","stint":"pilot2-tier2","evidence":{"commits":["1568449"],"integrated":[],"verified":"`python3 -m unittest tests.test_owner` passes 7 tests at 1568449, and fails 8 checks against 91970e3's Makefile and collector. Those are the alias, trailing-slash and ssh-alias origins, the three `owner` target cases and both collector refusals; only the Actions case already passed. In a clone whose origin is `/run/cs-sandbox-repo-2`, `make ci` exits 2 in 0.14 seconds with `owner: REPOSITORY is '/run/cs-sandbox-repo-2' and OWNER is 'run', which name no GitHub repository.`, then the line naming `OWNER=` and `REPOSITORY=`. The same clone passes `make ci` with pilot3's `OWNER=` and `REPOSITORY=` overrides, unchanged, in 15 seconds. Run with `--owner /run/cs-sandbox-repo-2`, the collector exits 2 and clones nothing. `make ci` in this repository passes with GH_TOKEN set, running 118 unit tests."},"resolution":"Every target that reads GitHub first runs `owner`, which stops the run when `REPOSITORY` is not `owner/name` and names both overrides. The origin parse also strips an ssh host alias and a trailing slash. The collector refuses an owner or a `$GITHUB_REPOSITORY` that GitHub could not hold, before it clones anything.","details":"The Makefile derives `REPOSITORY` from `git remote get-url origin` and `OWNER` from its first path segment. It strips three GitHub URL prefixes and trusts whatever is left. A campaign member's origin is a local path such as `/run/cs-sandbox-repo-2`, so the owner comes out as `run`. `make ci` then clones `https://github.com/run/dashboards/` and fails with `fatal: Authentication failed`, which reads as a credential problem rather than a wrong owner.\n\nIn pilot1 this cost a definition-of-done item: dashboards' `make ci` could not complete at any head, and three gate verdicts had no reproducible evidence. Pilot2 and pilot3 work around it by passing `OWNER=` and `REPOSITORY=` naming the fork. A human meeting it cold has no such hint.\n\nThe same parse misreads an origin cloned through an ssh host alias, such as `github.com-\u003caccount>`, which a workspace of forks uses to pick the right key. The alias is left in place, and the owner comes out as the whole scp-style prefix.\n\nA derived value that cannot be an `owner/name` should stop the run at once and name the `OWNER=` and `REPOSITORY=` overrides. The collector takes `--owner` without checking it either, and it runs standalone.","notes":[],"links":[]},{"id":"DSH-016","title":"tracer's ui sync installs the new build but leaves the committed viewer stale","type":"defect","severity":"med","status":"closed","foundBy":"session agent, auditing pilot2-improvements.md item 3 after the user asked: \"Add the missing parts of SAC-056, item 3 and item 5.\"","opened":"2026-09-22","resolved":"2026-09-22","stint":"ui-sync-steps","evidence":{"commits":["a4f1402"],"integrated":[],"verified":"`python3 -m unittest tests.test_actions` passes 12 tests. Without the tracer entry in deps-config.json, `test_a_ui_move_rebuilds_the_committed_viewer_after_the_install` fails, because the action has only its install step. The report regenerated at 2026-09-23T01:39:24Z gives `tracer:sync:ui-npm-codesweep-ai-ui` two steps, the install and `make viewer-build`. Both were run exactly as printed in a clean clone of tracer at 5215567, the report's commit. `git status` then showed the manifest, its lockfile, and the two viewer files the build rewrote. Rebuilding the viewer again changed nothing, which is the check tracer's CI job `viewer artifacts are current` makes. Tracer's `make ci` then passed, and `make parity` and `make fixtures` passed with Chrome 153, reporting `parity: PASS` and 36 fixture checks with 27 ok and 9 met. The one-step action run the same way left both viewer files stale, and that same rebuild check exited 1 on 67 insertions and 67 deletions."},"resolution":"deps-config.json now names `make viewer-build` after every ui move in tracer, as it already did for campaign. The audit found no other consumer missing a step. Ledger's entry already rebuilds, re-renders and raises RendererVersion. Dashboards commits nothing built from ui, because tokens.css is gitignored and `make` rebuilds it from the lockfile. Campaign's entry had no generator test, and now has one.","details":"The report's `tracer:sync:ui-npm-codesweep-ai-ui` action has one step, `npm install --save-exact @codesweep-ai/ui@\u003cversion>` in `apps/viewer`. Tracer commits the viewer that build produces under `internal/cli/viewer/`, and the binary embeds it. Run as printed, the action moves the pin and leaves the committed viewer built from the old version. Tracer's CI then fails its `viewer artifacts are current` job, which rebuilds the viewer and compares it with what is committed. Its local `make ci` has no such comparison, so the gate the action is checked against does not catch it.\n\n`deps-config.json` gives ledger's and campaign's ui syncs the rebuild steps they need, which DSH-012 added, and names nothing for tracer. The forks' report generated at 2026-09-22T23:46:55Z carries the one-step action, because tracer's pin is one ui build behind.","notes":[{"date":"2026-09-22","text":"Tracer's local `make ci` has no freshness check of its own, so only its CI job catches a stale viewer. The rebuild step keeps the action from reaching that job with a stale viewer."}],"links":["DSH-012"]},{"id":"DSH-017","title":"The status file names no commit a sibling can pin","type":"improvement","severity":"low","status":"closed","foundBy":"user report (host): \"Could we do this instead with the JSON status files that are published by the builds for dashboard consumption?\"","opened":"2026-09-23","resolved":"2026-09-23","stint":"last-green-pins","evidence":{"commits":["97e344a","ba992bb","bdffc5c"],"integrated":[],"verified":"All nine projects' status files are live in schema 2, and each lists its newest build first in `built`. In six sibling repositories, `make repin` moved each tool's pin to those first entries."},"resolution":"`built` lists up to ten commits CI built and passed, newest first, with the versions each was published under. A sibling pins the first.","details":"`make repin` in each project pins its codesweep-ai tools at main's tip, which may be a commit CI failed, is still building, or never built. The status file lists runs with seven-character SHAs, and finding the newest passing push build in it takes a parser. A top-level `built` field holding the full SHA lets a Makefile read it with one `sed`, from Pages rather than the rate-limited API.","notes":[{"date":"2026-09-23","text":"A project that publishes images has its commit named as `built` only once its `publish images` run for that commit has passed as well. Something that pins the commit may install its image, and before then there is none."},{"date":"2026-09-23","text":"`built` is now an object: the commit, and the versions it was published under. Those are its Go module version, its image tags and its npm versions, and every run records the same for its own commit. An npm pin needs the version rather than the SHA, and the history shows what each build published."},{"date":"2026-09-23","text":"`built` is now a list of up to 10 builds, newest first, so a repin waiting for a commit it pushed still finds it after a newer build. It reads `ci`'s own runs, and a project that publishes images needs the `publish images` commit status on the commit (DSH-019). `make repin` keeps a pin whose project lists no build, rather than moving it to the tip."},{"date":"2026-09-23","text":"The image check reads the registry, not the commit status, and the action's own job makes one GitHub API call: the run history. Its workflows, go.mod and details come from the checkout and the event, and git says whether a build is still on the branch."}],"links":[]},{"id":"DSH-018","title":"The dependencies page counts a pin on a sibling's last build as behind","type":"defect","severity":"med","status":"closed","foundBy":"user report (host): \"we don't want these situations to show on that dashboard appearing like the dependent is behind its dependency, as it's not in that case, it's on the latest built version of the dependency.\"","opened":"2026-09-23","resolved":"2026-09-23","stint":"last-green-pins","evidence":{"commits":["d1c58a2"],"integrated":[],"verified":"python3 -m unittest passes tests.test_resolve, including test_a_pin_on_the_last_build_is_in_sync_though_the_head_moved_on. A pin on a sibling's last build reads current though the sibling's head has moved past it."},"resolution":"The collector measures a sibling pin against the commit the sibling's status file names as built, and a sync step moves a pin to that commit.","details":"The collector measures a pin on a sibling against the sibling's branch head: `lag.commits` counts every commit between the two. `make repin` now pins to the sibling's last commit its CI built and passed, which its status file names as `built`. The head moves past that commit whenever a push is still building, failed, or changed nothing CI builds. A pin exactly where repin put it then reads as behind, and its sync step moves it to an unbuilt commit.","notes":[],"links":["DSH-017"]},{"id":"DSH-019","title":"`built` passes over a build whose image run GitHub lists under a later commit","type":"defect","severity":"med","status":"closed","foundBy":"session agent, while tracing which commit ui's publish images runs record","opened":"2026-09-23","resolved":"2026-09-23","stint":"last-green-pins","evidence":{"commits":["bdffc5c"],"integrated":[],"verified":"The action's tests pass, including test_images_count_for_the_commit_they_name_not_the_run. The live status files of lint, ledger, npmrevs, ui and sandbox each list their newest build, found by the version the registry holds."},"resolution":"A commit counts as built once ci passed on it and, for a project with images, the registry holds its version. No run is paired with another.","details":"A run that `ci` finishing starts is listed under whatever commit is main's head by then, not the commit `ci` built. `built` pairs a `publish images` run with a `ci` run by that listed commit. A fix is then never named when a ledger-only push lands while its `ci` runs. Its image run is listed under the ledger commit, which has no `ci` run. A commit can also be credited with another's images. Push C, then D while C's `ci` runs: C's image run is listed under D, even if D's own fails. In ui, the image run started by one commit's `ci` finishing was listed under the next commit, pushed while that `ci` ran. `built` also reads only the newest 100 runs of every workflow together, so enough `ledger` and `pages` runs push the last `ci` pass out of view.","notes":[{"date":"2026-09-23","text":"`built` no longer pairs runs. A commit counts once ci passed on it and its version is in every image repository the project publishes to, read from the registry's tag lists. `publish images` still posts its commit status, which the file does not read."}],"links":["DSH-017"]},{"id":"DSH-020","title":"dashboards publishes no status file, so a pin on its action has no build to move to","type":"improvement","severity":"low","status":"closed","foundBy":"user choice (host), answering where a pin on the dashboards action should move: \"dashboards publishes built\"","opened":"2026-09-23","resolved":"2026-09-23","stint":"last-green-pins","evidence":{"commits":["bdffc5c"],"integrated":[],"verified":"codesweep-ai.github.io/dashboards/ci-status.json is live in schema 2 and lists bdffc5c first in `built`. Every sibling's pages workflow pins the action at that commit."},"resolution":"The site's pages workflow writes this repository's own status file after ci or ledger finishes, so a pin on the action moves to a build like any other.","details":"Every project's `pages.yml` pins `codesweep-ai/dashboards/action` by commit, and a repin moves that pin like any other. The other projects publish a `ci-status.json` that lists the commits their CI built, and a pin moves only to one of those. This site publishes none, so a pin on the action has nothing to move to but main's tip, which may not have built.","notes":[],"links":["DSH-017"]},{"id":"DSH-021","title":"A push that changes only the ledger runs ci","type":"improvement","severity":"low","status":"closed","foundBy":"user report (host): \"support ledger builds on pushes that only contain ledger changes, with just linting, ledger checking, and a pages build to publish the ledger page\"","opened":"2026-09-23","resolved":"2026-09-23","stint":"ledger-builds","evidence":{"commits":["b79453d"],"integrated":[],"verified":"Pushing 354efdf, which changed only `ledger/`, started the ledger and pages workflows and no ci. Both passed, and the status file still lists bdffc5c first in `built`."},"resolution":"ci skips a push that changes only `ledger/`. The ledger workflow runs the ledger check and the document linters, and pages republishes the ledger's page. Nothing is built or published, so `built` stays.","details":"Closing an issue is a commit that changes only `ledger/`, and pushing it runs the whole of `ci`. Nothing `ci` checks has changed but the records, and each run adds to the history the status file reads. Such a push needs only the ledger check, the document linters and a site build, which publishes the ledger's page.","notes":[],"links":[]},{"id":"DSH-022","title":"The dependencies page moves a pin to the head when its sibling lists no build","type":"defect","severity":"low","status":"closed","foundBy":"user report (host): \"also make the deps dashboard hold instead of moving to head\"","opened":"2026-09-23","resolved":"2026-09-23","stint":"last-green-pins","evidence":{"commits":["bdffc5c"],"integrated":[],"verified":"The collector's tests pass, including test_without_a_last_build_a_pin_is_held and test_a_held_sibling_pin_is_no_action."},"resolution":"A pin whose sibling lists no build is held. Its status is `held`, `lag.held` says why, and no action moves it.","details":"A pin on a sibling whose status file lists no build, or names one off its branch, is measured against the sibling's head. The page then counts it behind, and its sync step moves the pin to the head, which may never have built. `make repin` and oss-repin hold such a pin where it is instead.","notes":[],"links":["DSH-018","DSH-017"]},{"id":"DSH-023","title":"An internal npm pin's step waits for npmjs.com, though the build's image carries the version","type":"defect","severity":"low","status":"closed","foundBy":"user report (host): \"We shouldn't be gated by the time it takes for a package to be available on npmjs.com as we have a way to get the packages from the images we publish on ghcr.io, right?\"","opened":"2026-09-24","resolved":"2026-09-24","stint":"npm-repins","evidence":{"commits":["c17f7a3"],"integrated":[],"verified":"The collector's tests pass, and the seven new or changed ones fail on the code before c17f7a3. Among them are test_where_npm_lists_no_version_yet_the_builds_image_names_it and test_a_project_with_npmrevs_installs_it_from_the_image. ci run 36059417029 passed at c17f7a3. The published deps.json names `scripts/with-npmrevs.sh` as the installer of every internal npm pin. The steps for the behind ui pins in ledger and tracer install through it. No pin was image-only when that file was written, so the tests alone cover that case."},"resolution":"The version a behind internal npm pin moves to comes from the status file, then npmjs.com, then the build's `npm/\u003cname>` image, which `lag.image_only` marks. A project that carries `scripts/with-npmrevs.sh` installs through it, so an image-only version installs at once. A project without it still waits for npmjs.com.","details":"The collector names the version a behind internal npm pin moves to from the status file's `npm` field, and then from npmjs.com. The pages run that npm's own run starts reads npmjs.com before the version it just published is listed there. So the status file names the build with no npm version, and every npm publish on 2026-09-23 did this. Until pages runs again, the pin's step only says to wait for the registry. The build's `npm/\u003cname>` image already carries the same version, and `scripts/with-npmrevs.sh` installs from it. The step also runs a plain `npm install`, which cannot reach a version that only an image holds.","notes":[],"links":["DSH-017"]},{"id":"DSH-024","title":"The ledger's ui move lists by hand the steps `make viewer-repin` now takes","type":"improvement","severity":"low","status":"closed","foundBy":"agent review (session): ledger's new `make viewer-repin` covers the steps deps-config.json lists for its ui pin","opened":"2026-09-24","resolved":"2026-09-24","stint":"npm-repins","evidence":{"commits":["f94340d"],"integrated":[],"verified":"test_the_ui_pin_installs_and_viewer_repin_carries_it_through passes. A collector run over ledger and ui listed two steps for ledger's ui pin: the install through `scripts/with-npmrevs.sh`, then `make viewer-repin`. ci run 36064180914 passed."},"resolution":"deps-config.json names `make viewer-repin` as the one step after ledger's ui install. It no longer lists `UIVersion` as a second place the pin is written, since the target sets it and ledger's test holds it to the pin.","details":"For ledger's `@codesweep-ai/ui` pin, deps-config.json names `internal/ledger/render.go`'s `UIVersion` as a second place the pin is written. After the install it lists four more steps: raise `RendererVersion` by hand, `make viewer-build build`, render both ledgers, and edit the sample line in MANUAL.md. Ledger's `make viewer-repin` now does all of it, and a test in ledger holds `UIVersion` to the pin. A person who follows the page's steps does by hand what one target does, and can miss the version bump that target makes.","notes":[],"links":["DSH-023"]},{"id":"DSH-025","title":"The status action leaves go.mod and a refused API response open","type":"defect","severity":"low","status":"closed","foundBy":"agent review (session): ResourceWarnings in the collector's and action's test run","opened":"2026-09-24","resolved":"2026-09-24","stint":"npm-repins","evidence":{"commits":["7c88a9b"],"integrated":[],"verified":"The collector's and the action's tests, run with `-W always::ResourceWarning`, report no warning, where they reported eight before the change. ci run 36064180914 passed."},"resolution":"The action reads `go.mod` inside `with`, and closes every HTTP error response it handles, in `quietly()`, the compare call and `main`.","details":"In its own job the action reads the checkout's `go.mod` with a bare `open()`, and never closes the file. Where the compare API answers 404 or 422, the handler returns without closing the error response, which holds the connection. Python reports both as a ResourceWarning in the test run. Neither changes what the status file says, since the job ends soon after.","notes":[],"links":[]},{"id":"DSH-026","title":"A passing make ci leaves no build a sibling can pin","type":"improvement","severity":"low","status":"closed","foundBy":"user report (host): \"it doesn't seem possible anymore to have make repin do pin on local builds, which haven't been published to ghcr.io or npmjs.com or built in the Github CI builds\"","opened":"2026-09-25","resolved":"2026-09-25","stint":"local-builds","evidence":{"commits":["d85e920"],"integrated":[],"verified":"`make ci` at 7f94c70 ended `record-build: recorded dashboards 7f94c70 as a local build in ~/.local/share/cs-builds/codesweep-ai (go v0.0.0-20260926051938-7f94c705329b)`. tests/test_record_build.py passes all 15 of its tests against this same scripts/record-build.sh, byte for byte. GitHub CI's `ci` passed on 7f94c70."},"resolution":"A clean, passing `make ci` now records its commit in the owner's build store, `~/.local/share/cs-builds/\u003cowner>/`. It keeps the Go module in the module proxy's layout, the npm packages where the project has them, and an entry naming the versions. A run over uncommitted changes records nothing, and says so.","details":"`make ci` runs every gate CI runs, on this machine, and leaves nothing another project can pin. Pins move only to commits GitHub CI lists as built. So a change across several projects has to be pushed and built one project at a time before the next can pin it. A clean passing run could record its commit as a local build instead: the module zip Go resolves it from, and an entry naming its versions. They would go in a store the sibling projects read. Go and npm builds of a clean commit are byte-identical to CI's. A pin on such a build is therefore the pin CI writes once that commit is pushed. SPEC.md describes the status file every project publishes, and would describe that store's layout beside it.","notes":[],"links":[]},{"id":"DSH-027","title":"make repin cannot pin a sibling's local build","type":"improvement","severity":"low","status":"closed","foundBy":"user report (host): \"it doesn't seem possible anymore to have make repin do pin on local builds, which haven't been published to ghcr.io or npmjs.com or built in the Github CI builds\"","opened":"2026-09-25","resolved":"2026-09-25","stint":"local-builds","evidence":{"commits":["d85e920"],"integrated":[],"verified":"tests/test_repin_go.py passes all 7 of its tests against this same scripts/repin-go.sh. They pin and name a newer local build, and take CI's under `LOCAL=0`, when CI's is newer, and on a tie. They hold a build awaiting images, and skip one whose commit left the branch. In a scratch workspace, campaign's copy left out sandbox's newest local build once the sandbox checkout beside it held that commit on no branch. It said so, and took the build CI had made. GitHub CI's `ci` passed on 7f94c70."},"resolution":"`make repin` now moves each cs- pin to the newer, by commit time, of the sibling's last CI build and its newest local build. It names each pin taken from a local build, and resolves those through the store's module proxy ahead of the usual one. `make repin LOCAL=0` takes CI builds only, and no module is fetched with `GOPROXY=direct` any more.","details":"`make repin` moves each codesweep-ai tool pin to the first commit in `built` of its project's status file, and to nothing else. A build that a clean `make ci` recorded in the build store is invisible to it. So a change made across several projects cannot pin its own parts before they are pushed. Every module is also fetched with `GOPROXY=direct`. On a cold cache that reaches every module's source host, and it hung for over seven minutes where one did not answer. Nothing tests which build a repin takes, and SPEC.md says nothing of how a repin reads the store.","notes":[],"links":[]},{"id":"DSH-028","title":"The build store records no images, so nothing can wait for them","type":"improvement","severity":"low","status":"closed","foundBy":"session agent, reviewing how local builds reach images (tasks/pin-on-local-builds.md, section 7)","opened":"2026-09-25","resolved":"2026-09-25","stint":"local-builds","evidence":{"commits":["d85e920"],"integrated":[],"verified":"tests/test_repin_go.py's image test passes: a local build whose entry awaits two images is left out and named until a file for each exists, then taken. For real, sandbox's `make ci` at its pushed head recorded the build awaiting sandbox and sandbox-slim, and `cs-sandbox build` and `cs-sandbox build --slim` then wrote both files under images/sandbox/. GitHub CI's `ci` passed on 7f94c70."},"resolution":"A project that publishes images names them in `CS_BUILD_IMAGES` when it records, and its entry lists them under `awaits`. An image build of the commit writes a file for each under images/. The repin takes the build only once all of them are there, and names a newer one still waiting.","details":"The status file lists a commit of a project that publishes images only once its images are published. The build store has no such rule, and no place to put images at all. A local build of sandbox is listed as soon as `make ci` passes, before any image of it exists. A sibling that pins it then names an image no host has built.","notes":[],"links":[]},{"id":"DSH-029","title":"The build store cannot travel between campaign members","type":"improvement","severity":"low","status":"closed","foundBy":"session agent, reviewing how local builds reach campaign members (tasks/pin-on-local-builds.md, section 8)","opened":"2026-09-25","resolved":"2026-09-25","stint":"local-builds","evidence":{"commits":["d85e920"],"integrated":[],"verified":"The store tests in tests/test_record_build.py pass. In them, `CS_BUILD_STORE` names the store outright, and a store that is a git repository gets a commit for each build. The take-in test pushes to refs/campaign/orchestrator, and `record-build.sh store` takes it in, fast forward and by a merge. GitHub CI's `ci` passed on 7f94c70."},"resolution":"`CS_BUILD_STORE` names the store directory outright. A store that is a git repository keeps each build as a commit, and takes in what the orchestrator delivered before it is read or written. The campaign's member fetch merges a fetched store at once.","details":"A campaign member's store is found by owner, and inside a member the fallback owner is the host user's name, since every checkout sits in the home directory. So a member cannot be pointed at the store a campaign hands it. The store is also a plain directory: `make ci` leaves new builds as loose files, and nothing takes in the builds the orchestrator delivers to a member's clone.","notes":[],"links":[]},{"id":"DSH-030","title":"make repin can pin a local build of a commit that is gone","type":"defect","severity":"low","status":"closed","foundBy":"session agent, after rewriting unpushed history left store entries for commits no branch holds","opened":"2026-09-25","resolved":"2026-09-25","stint":"local-builds","evidence":{"commits":["7f94c70"],"integrated":[],"verified":"tests/test_repin_go.py passes all 7 of its tests against this same scripts/repin-go.sh. They pin and name a newer local build, and take CI's under `LOCAL=0`, when CI's is newer, and on a tie. They hold a build awaiting images, and skip one whose commit left the branch. In a scratch workspace, campaign's copy left out sandbox's newest local build once the sandbox checkout beside it held that commit on no branch. It said so, and took the build CI had made. GitHub CI's `ci` passed on 7f94c70."},"resolution":"A local build counts only if its commit is on a branch of the sibling's own checkout beside the consumer, where there is one. A newer build left out that way is named. Without such a checkout, as in a campaign member, the store is taken as it stands.","details":"`scripts/repin-go.sh` takes the newest local build in the store whatever its commit. After a rebase or a squash, the store still holds builds of the commits that were replaced, and they carry the newest times. So `make repin` can pin a commit that no branch of the sibling's checkout holds any more, and its push is then held.","notes":[],"links":[]},{"id":"DSH-031","title":"Installs through cs-npmrevs fail once the build store holds enough npm packages","type":"defect","severity":"med","status":"closed","foundBy":"session agent, investigating campaign's failed `make repin` of 2026-09-29","opened":"2026-09-29","resolved":"2026-09-29","stint":"2026-09-29 npm build store","evidence":{"commits":["b3adb13"],"integrated":[],"verified":"Against a stand-in server that exits at once, `with-npmrevs.sh` failed in 0.35 s and printed its log. Against one that took 24 s to listen, it waited and ran the command. Campaign's `make repin`, rerun with these scripts against the same unpruned store, moved the `@codesweep-ai/ui` pin and rebuilt the viewer in 31 s. `python3 -m unittest tests.test_record_build`: 18 of 18 pass, and test_a_recorded_build_removes_the_npm_packages_of_older_ones fails against the previous record-build.sh. `make check` passed. Run over a copy of the owner's store, the prune took npm/ from 179 packages (311 MB) to 47 (83 MB)."},"resolution":"`scripts/with-npmrevs.sh` now waits as long as the registry runs, up to a minute, and stops at once if it exits. Each recorded build removes the npm packages of older ones. A project keeps them for its three newest builds recorded within three days, and for its newest whatever its age. Entries, modules and images stay, and a store that is a repository, as a campaign's is, is left whole.","details":"`scripts/with-npmrevs.sh` starts cs-npmrevs and gave it 50 checks, about 10 seconds, to answer. cs-npmrevs reads every package it serves before it listens, and it serves the owner's build store, where nothing removed old npm packages. By 2026-09-29 the store held 179 packages (311 MB), startup took about 9 seconds, and campaign's `make repin` failed with `the registry did not come up`. Each clean `make ci` in lint, ledger or npmrevs adds five more packages, and `npm run ci` in ui adds one.","notes":[],"links":[]}],"drafts":[],"queue":{"recommendedBy":"session agent","updated":"2026-09-23","items":[{"id":"DSH-003","why":"The next placeholder on the index, and every repository already produces its data."}]},"description":null,"links":[],"commitUrlTemplate":null,"rendererVersion":"0.7.1","uiVersion":"0.3.1-dev.20260928063514.abadcfb","lastActivity":"2026-09-29","derived":{"terminalStatuses":["closed","wont-fix","moved-to-roadmap"],"lastActivity":{"DSH-001":"2026-09-23","DSH-002":"2026-09-12","DSH-003":"2026-0
