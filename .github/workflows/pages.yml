# Publish this repository to codesweep.ai/dashboards/.
#
# Each dashboard is generated by a workflow of its own, called from here, so a
# run shows each one as a sub-workflow with its own log and result:
#
#   dashboard-ci.yml     checks the CI page's list of projects
#   dashboard-deps.yml   collects deps.json and the files beside it
#
# This workflow then assembles the site from what they hand over, renders the
# README as the landing page, and deploys. A new dashboard is a new workflow
# called here, and its artifact downloaded before the site is built.
#
# The dependencies dashboard is why this site builds on a schedule. What it
# reports moves without anyone committing, so every run reads the world again,
# and the schedule refreshes facts rather than a timestamp.
#
# The site also carries this repository's own ci-status.json, as each sibling's
# does. Its `built` names the commits of this repository a project may pin the
# action at. So the site builds when a push's build has finished, rather than on
# the push: ci runs for a push that changes anything outside ledger/, and
# ledger.yml for one that changes the ledger. Built on the push, the file would
# report ci still running, and nothing would rewrite it until the next run.
name: pages

on:
  workflow_run:
    workflows: [ci, ledger]
    types: [completed]
  # Daily, at a minute nobody else picks. The page flags data older than 36
  # hours, which is a missed day plus slack: GitHub disables a schedule in a
  # repository with no activity for 60 days, and that is how it would show.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read # the site is built from the tree and nothing is written back

# One site, so one deploy at a time. Not cancelled: a superseded run is about to
# be replaced anyway, and a deployment killed halfway is worse than a page that
# is a minute stale.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ci.yml runs on pull_request as well as on push, and workflow_run fires for
  # either. A run started that way still builds main, so a pull request's ci
  # would only publish the same site again for nothing. The event is what tells
  # them apart: a fork's branch can be called main too. The build waits on both
  # jobs, so it is skipped with them.
  ci-dashboard:
    name: CI dashboard
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    uses: ./.github/workflows/dashboard-ci.yml

  deps-dashboard:
    name: dependencies dashboard
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    uses: ./.github/workflows/dashboard-deps.yml

  build:
    name: build the site
    needs: [ci-dashboard, deps-dashboard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # the site is built from the tree and nothing is written back
      actions: read # the status file is this repository's own workflow runs
    steps:
      # The branch's history without its file contents, beyond what the site is
      # built from: the status file asks git whether each build it lists is
      # still on the branch, rather than asking GitHub's API.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      # This repository's own status file, written by the action in this tree,
      # as the one a sibling pins writes its. Jekyll copies it into the site like
      # any other file at the repository root. A failure here costs this
      # repository its own status, not the dashboards every project reads, so the
      # site still publishes, and the step shows as failed.
      - name: write the CI status
        uses: ./action
        continue-on-error: true
        with:
          window: "20"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # The design tokens come out of @codesweep-ai/ui rather than a copy kept
      # here, so they are fetched before the site is built. tokens.css is a build
      # artifact and is not in the tree until this runs.
      - run: npm ci
      - run: npm run tokens

      # Each dashboard's files, as its own workflow checked them. They land over
      # the tree, so the site publishes exactly what was generated and checked.
      - uses: actions/download-artifact@v8
        with:
          pattern: dashboard-*
          merge-multiple: true
          path: ./

      - uses: actions/configure-pages@v5

      # The same Jekyll the sibling projects' branch-served sites are built with,
      # so the documents render the same way here. That includes the plugin that
      # turns README.md into the site's index, which is how this repository's
      # landing page comes to be its README, as in every sibling project.
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      # The pages are useless without these, and a build that quietly dropped
      # one would show up only as a blank dashboard.
      - name: check the pages were published
        run: |
          # index.html is not in the tree: Jekyll renders it from README.md, so
          # checking for it here is what catches that step silently not running.
          for f in index.html ci.html ci.js deps.html deps.js deps.json deps-actions.json deps-feed.xml deps.cdx.json dashboard.css tokens.css projects.json; do
            test -s "_site/$f" || { echo "missing from the built site: $f" >&2; exit 1; }
          done
          # Jekyll's default excludes cover node_modules, and this repository
          # names no exclude list of its own, so those defaults still apply.
          # Publishing the dependency tree would be a slow, silent mistake.
          test ! -e _site/node_modules || { echo "node_modules reached the site" >&2; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    name: deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Publishing is this job's alone, so no dashboard's workflow holds the right.
    permissions:
      pages: write # publish the built site
      id-token: write # the deployment is minted from the run rather than from a key
    # The environment carries the deployment's URL and whatever protection rules
    # the repository puts on it; deploy-pages refuses to run outside one.
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
